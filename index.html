<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Moura Finance"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>Moura Finance</title><style>
:root{--bg:#0b1020;--panel:#141b2e;--panel2:#1b2440;--txt:#f4f6fc;--muted:#98a2b8;--blue:#7c9cff;--green:#4ade80;--red:#fb7185;--yellow:#fbbf24}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}header{padding:22px 18px 14px;display:flex;justify-content:space-between;align-items:center}small{color:var(--muted)}h1{font-size:24px;margin:4px 0 0}.btn{border:0;background:var(--blue);color:#fff;padding:12px 16px;border-radius:13px;font-weight:700}.wrap{padding:0 16px 100px}.hero{background:linear-gradient(135deg,#1b2440,#25345b);padding:20px;border-radius:22px;margin-bottom:13px}.big{font-size:30px;font-weight:800;margin:9px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat,.item,.section{background:var(--panel);padding:15px;border-radius:17px;margin-bottom:10px}.stat strong{display:block;font-size:20px;margin-top:7px}.green{color:var(--green)}.red{color:var(--red)}.yellow{color:var(--yellow)}.muted{color:var(--muted)}.sectiontitle{font-weight:800;font-size:18px;margin:18px 0 10px}.itemtop{display:flex;align-items:center;gap:10px}.itemtop .desc{flex:1}.amount{font-weight:800}.itemfoot{display:flex;align-items:center;justify-content:space-between;margin-top:13px;gap:6px;flex-wrap:wrap}.mini{background:var(--panel2);color:var(--txt);border:0;border-radius:9px;padding:8px 10px}.mini.pay{background:#173d32;color:var(--green)}nav{position:fixed;bottom:0;left:0;right:0;background:#141b2ef2;border-top:1px solid #27314d;display:flex;justify-content:space-around;padding:10px 4px calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(15px)}nav button{background:none;border:0;color:var(--muted);font-size:12px;padding:7px}nav button.active{color:var(--blue)}.bar{height:7px;background:var(--panel2);border-radius:8px;margin-top:7px;overflow:hidden}.bar span{display:block;height:100%;background:var(--blue)}.overlay{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end}.sheet{background:var(--panel);width:100%;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:22px 18px calc(25px + env(safe-area-inset-bottom))}.sheet h2{margin-top:0}label{display:block;color:var(--muted);font-size:13px;margin:13px 0 6px}input,select,textarea{width:100%;background:var(--bg);border:1px solid #27314d;color:var(--txt);border-radius:12px;padding:13px;font:inherit}textarea{min-height:70px}.full{width:100%;margin-top:18px}.empty{color:var(--muted);text-align:center;padding:25px}.pill{font-size:12px;font-weight:700}
</style></head><body>
<header><div><small>MOURA FINANCE</small><h1>Controle financeiro</h1></div><button class="btn" onclick="openForm()">＋</button></header>
<main class="wrap" id="main"></main>
<nav><button class="active" onclick="tab='Resumo';render()">▦<br>Resumo</button><button onclick="tab='Despesas';render()">▤<br>Despesas</button><button onclick="tab='Recorrentes';render()">↻<br>Recorrentes</button></nav>
<div class="overlay" id="overlay" onclick="if(event.target.id==='overlay')closeForm()"><div class="sheet"><div style="display:flex;justify-content:space-between"><h2>Nova despesa</h2><button class="mini" onclick="closeForm()">✕</button></div>
<form id="form"><label>Descrição</label><input id="title" required placeholder="Ex.: Conta de água"><label>Valor (R$)</label><input id="amount" required type="number" min=".01" step=".01" placeholder="0,00"><label>Categoria</label><select id="category"><option>Moradia</option><option>Alimentação</option><option>Transporte</option><option>Saúde</option><option>Educação</option><option>Serviços</option><option>Lazer</option><option>Compras</option><option>Outros</option></select><label>Vencimento</label><input id="due" required type="date"><label><input id="recurring" type="checkbox" style="width:auto"> Despesa recorrente</label><label>Frequência</label><select id="frequency"><option>Mensal</option><option>Semanal</option><option>Anual</option></select><label>Observações</label><textarea id="notes" placeholder="Opcional"></textarea><label>Anexo (foto/PDF)</label><input id="attachment" type="file" accept="image/*,.pdf"><button class="btn full">Salvar despesa</button></form></div></div>
<script>
const KEY='moura-finance-pwa-v1';let expenses=JSON.parse(localStorage.getItem(KEY)||'[]'),tab='Resumo';
const brl=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),today=()=>new Date().toISOString().slice(0,10),fmt=d=>d?d.split('-').reverse().join('/'):'—';
function save(){localStorage.setItem(KEY,JSON.stringify(expenses));render()}
function status(x){return x.paid?'PAGO em '+fmt(x.paid):(x.due<today()?'VENCIDA':'PENDENTE')}
function card(name,val,color=''){return `<div class="stat"><small>${name}</small><strong class="${color}">${val}</strong></div>`}
function item(x){return `<div class="item"><div class="itemtop"><div class="desc"><b>${esc(x.title)}</b><br><small>${esc(x.category)} · vence ${fmt(x.due)} ${x.recurring?'· '+x.frequency:''}</small></div><span class="amount">${brl(x.amount)}</span></div><div class="itemfoot"><span class="pill ${x.paid?'green':x.due<today()?'red':'yellow'}">${status(x)}</span><div>${x.file?'<span class="muted">📎 '+esc(x.file)+'</span>':''} ${!x.paid?`<button class="mini pay" onclick="pay('${x.id}')">Registrar pagamento</button>`:''}<button class="mini" onclick="attach('${x.id}')">📎</button><button class="mini" onclick="removeItem('${x.id}')">Excluir</button></div></div></div>`}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let m=expenses.filter(x=>x.due.slice(0,7)===today().slice(0,7)),paid=expenses.filter(x=>x.paid).reduce((a,x)=>a+x.amount,0),pending=expenses.filter(x=>!x.paid).reduce((a,x)=>a+x.amount,0),late=expenses.filter(x=>!x.paid&&x.due<today()),html='';
if(tab==='Resumo'){let total=m.reduce((a,x)=>a+x.amount,0),cats={};expenses.forEach(x=>cats[x.category]=(cats[x.category]||0)+x.amount);let max=Math.max(1,...Object.values(cats));html=`<div class="hero"><small>Despesas cadastradas no mês</small><div class="big">${brl(total)}</div><span class="green">${m.filter(x=>x.paid).length} de ${m.length} contas pagas</span></div><div class="grid">${card('Total pago',brl(paid),'green')}${card('Em aberto',brl(pending),'yellow')}${card('Vencidas',late.length,'red')}${card('Lançamentos',expenses.length)}</div>${late.length?`<div class="section red">⚠ ${late.length} conta(s) vencida(s) sem pagamento</div>`:''}<div class="sectiontitle">Gastos por categoria</div>${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div style="margin:12px 3px"><div style="display:flex;justify-content:space-between"><small>${esc(c)}</small><small>${brl(v)}</small></div><div class="bar"><span style="width:${v/max*100}%"></span></div></div>`).join('')}<div class="sectiontitle">Últimos lançamentos</div>${expenses.slice(0,5).map(item).join('')||'<div class="empty">Cadastre sua primeira despesa no botão +</div>'}`}
else {let list=tab==='Recorrentes'?expenses.filter(x=>x.recurring):expenses;html=`<div class="sectiontitle">${tab}</div>${list.map(item).join('')||'<div class="empty">Nenhuma despesa cadastrada.</div>'}`}
document.getElementById('main').innerHTML=html}
function openForm(){document.getElementById('overlay').style.display='flex';document.getElementById('due').value=today()}
function closeForm(){document.getElementById('overlay').style.display='none'}
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();let f=document.getElementById('attachment').files[0];let fileName=f?.name||'';let data={id:Date.now().toString(),title:title.value,amount:Number(amount.value),category:category.value,due:due.value,recurring:recurring.checked,frequency:frequency.value,notes:notes.value,file:fileName,paid:null};expenses.unshift(data);save();closeForm();e.target.reset();if(f){alert('Registro salvo. Nesta versão o nome do anexo é associado; o arquivo em si não é armazenado no app.') }});
function pay(id){let x=expenses.find(x=>x.id===id);if(confirm(`Confirmar pagamento de ${brl(x.amount)} — ${x.title}?`)){x.paid=today();save();if(x.recurring&&confirm('Criar próxima ocorrência desta conta?')){let d=new Date(x.due+'T12:00:00');x.frequency==='Semanal'?d.setDate(d.getDate()+7):x.frequency==='Anual'?d.setFullYear(d.getFullYear()+1):d.setMonth(d.getMonth()+1);expenses.unshift({...x,id:Date.now().toString(),due:d.toISOString().slice(0,10),paid:null,file:''});save()}}}
function removeItem(id){if(confirm('Excluir esta despesa?')){expenses=expenses.filter(x=>x.id!==id);save()}}
function attach(id){alert('Para anexar arquivo, use o campo Anexo ao cadastrar. A persistência de arquivos será adicionada em uma próxima versão.')}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
